name: Build Stylus Export

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["docs/**"]

concurrency:
  group: userstyles-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'carbon-colours/userstyles'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: all-userstyles-export

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record existing release tag
        id: release
        run: |
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" > /dev/null

          tag_sha=$(git ls-remote --tags origin \
            "refs/tags/$RELEASE_TAG" | cut -f1)

          if [ -z "$tag_sha" ]; then
            echo "Release tag is missing."
            exit 1
          fi

          echo "sha=$tag_sha" >> "$GITHUB_OUTPUT"

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.3

      - name: Generate Stylus import
        run: deno task ci:stylus-import

      - name: Verify export
        run: |
          test -s dist/import.json
          jq -e 'type == "array" and length > 1' \
            dist/import.json > /dev/null

      - name: Update release tag
        env:
          EXPECTED_TAG: ${{ steps.release.outputs.sha }}
        run: |
          git push \
            --force-with-lease="refs/tags/$RELEASE_TAG:$EXPECTED_TAG" \
            origin "HEAD:refs/tags/$RELEASE_TAG"

      - name: Upload release artifact
        run: |
          gh release upload "$RELEASE_TAG" \
            ./dist/import.json \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
